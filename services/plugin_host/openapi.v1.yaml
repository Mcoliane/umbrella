openapi: 3.1.0
info:
  title: Umbrella Plugin Host Service API
  version: 1.2.0
  description: >-
    Process-separated invocation boundary for catalog-declared actions, with compatibility rechecks and
    manifest-driven execution controls (env allowlist, scratch cwd, timeout, input/output size caps).
    This service does not sandbox plugins: they run as ordinary local subprocesses under the
    plugin-host service user, with full filesystem and network access. The manifest
    `executionPolicy` fs/network/isolationProfile fields are validated and recorded, not enforced —
    every invoke response carries a `policyWarnings` entry saying so.
servers:
  - url: http://127.0.0.1:8785
paths:
  /v1/plugin-host/health:
    get:
      responses:
        '200': { description: OK }
  /v1/plugin-host/invoke:
    post:
      responses:
        '200': { description: Invocation result }
